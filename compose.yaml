# Local development stack.
#
#   docker compose up -d db            # just PostgreSQL (for `make dev`)
#   docker compose up --build          # PostgreSQL + Turnbacks in development mode
#
# Administration needs a client certificate via Caddy, so it is not available
# in this stack: use `make dev` (you are admin from your own machine) or
# compose.prod.yaml.
#
# PostgreSQL is published on 127.0.0.1 only. For production use
# compose.prod.yaml, which does not publish the database at all.
name: turnbacks

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: turnbacks
      POSTGRES_PASSWORD: turnbacks
      POSTGRES_DB: turnbacks
    ports:
      - "127.0.0.1:${TURNBACKS_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnbacks -d turnbacks"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TURNBACKS_ENV: development
      TURNBACKS_DATABASE_URL: postgres://turnbacks:turnbacks@db:5432/turnbacks?sslmode=disable
      TURNBACKS_PUBLIC_URL: http://localhost:${TURNBACKS_APP_PORT:-8080}
      TURNBACKS_LOG_FORMAT: text
    ports:
      - "127.0.0.1:${TURNBACKS_APP_PORT:-8080}:8080"

volumes:
  db-data:
