name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Test (unit + PostgreSQL integration via testcontainers)
        run: go test -race -count=1 ./cmd/... ./internal/... ./db/... ./api/... ./web
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/... ./db/... ./api/...
      - name: Generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code db/sqlc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turnbacks
          POSTGRES_PASSWORD: turnbacks
          POSTGRES_DB: turnbacks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turnbacks" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make build
      - run: cd web && npx playwright test
        env:
          CI: "true"
          E2E_DATABASE_URL: postgres://turnbacks:turnbacks@127.0.0.1:5432/turnbacks_e2e?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=${{ github.sha }} -t turnbacks:ci .
      - name: Publish to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/turnbacks
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag turnbacks:ci "$IMAGE:${{ github.sha }}"
          docker tag turnbacks:ci "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/turnbacks -f deploy/environments/staging/values.yaml
      - run: helm lint deploy/helm/turnbacks -f deploy/environments/production/values.yaml
