name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Test (unit + PostgreSQL integration via testcontainers)
        run: go test -race -count=1 ./cmd/... ./internal/... ./db/... ./api/... ./web
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/... ./db/... ./api/...
      - name: Generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code db/sqlc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turnbacks
          POSTGRES_PASSWORD: turnbacks
          POSTGRES_DB: turnbacks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turnbacks" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make build
      - run: cd web && npx playwright test
        env:
          CI: "true"
          E2E_DATABASE_URL: postgres://turnbacks:turnbacks@127.0.0.1:5432/turnbacks_e2e?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  # Builds the image on every run; pushes it to ghcr.io/tomoconnor/turnbacks
  # on pushes to main and v* tags, once the tests have passed.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write
      id-token: write # build provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/tomoconnor/turnbacks
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # main → :main and :sha-<short>; v1.2.3 → :1.2.3, :1.2, :1 and :latest
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Turnbacks
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/turnbacks -f deploy/environments/staging/values.yaml
      - run: helm lint deploy/helm/turnbacks -f deploy/environments/production/values.yaml
