# Example: provide the Slack signing secret from a secret manager with External
# Secrets Operator, instead of committing it to git. Adjust the store and
# remote keys, then set slack.enabled=true and
# slack.signingSecret.existingSecret=turnbacks-slack.
#
# The admin CA certificate (admin.clientCA.existingSecret) is not secret, so a
# plain `kubectl create secret generic turnbacks-admin-ca --from-file=ca.crt`
# (or a Sealed Secret / this pattern) is fine. Never store ca.key in the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: turnbacks-slack
  namespace: turnbacks-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault # or aws-secrets-manager, azure-keyvault, gcp-secret-manager…
  target:
    name: turnbacks-slack
  data:
    - secretKey: slack-signing-secret
      remoteRef:
        key: turnbacks/production
        property: slack-signing-secret
