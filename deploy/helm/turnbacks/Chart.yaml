apiVersion: v2
name: turnbacks
description: Turnbacks — record and quantify recurring operational friction.
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.27.0-0"
keywords: [turnbacks, productivity, technical-debt]
annotations:
  # The database is provisioned with CloudNativePG; install the operator first
  # (see deploy/argocd/cnpg-operator.yaml or https://cloudnative-pg.io).
  turnbacks/requires: "CloudNativePG operator >= 1.25 when database.cloudnativepg.enabled"
