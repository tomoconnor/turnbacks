{{- with .Values.database.cloudnativepg }}
{{- if .enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "turnbacks.dbClusterName" $ }}
  labels:
    {{- include "turnbacks.labels" $ | nindent 4 }}
  annotations:
    # Create the database before the application (Argo CD sync waves).
    argocd.argoproj.io/sync-wave: "-1"
    # Never let a sync or uninstall delete the database by accident.
    argocd.argoproj.io/sync-options: Delete=false
    helm.sh/resource-policy: keep
spec:
  instances: {{ .instances }}
  imageName: {{ .imageName }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: {{ .database }}
      owner: {{ .owner }}
  storage:
    size: {{ .storage.size }}
    {{- with .storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- if .walStorage.enabled }}
  walStorage:
    size: {{ .walStorage.size }}
    {{- with .walStorage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- end }}
  {{- with .resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if .affinity }}
  affinity:
    {{- toYaml .affinity | nindent 4 }}
  {{- else }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  {{- end }}
  {{- if .enablePodMonitor }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
  {{- with .backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
