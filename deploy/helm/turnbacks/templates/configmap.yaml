apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "turnbacks.fullname" . }}
  labels:
    {{- include "turnbacks.labels" . | nindent 4 }}
data:
  TURNBACKS_ENV: production
  TURNBACKS_HTTP_ADDR: ":8080"
  {{- with .Values.publicURL }}
  TURNBACKS_PUBLIC_URL: {{ . | trimSuffix "/" | quote }}
  {{- end }}
  TURNBACKS_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TURNBACKS_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  TURNBACKS_REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}
  TURNBACKS_SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  {{- if .Values.admin.clientCA.existingSecret }}
  TURNBACKS_ADMIN_CLIENT_CA: /etc/turnbacks/admin-ca/ca.crt
  TURNBACKS_ADMIN_CERT_HEADER: {{ .Values.admin.certHeader | quote }}
  TURNBACKS_ADMIN_NAMES: {{ join "," .Values.admin.names | quote }}
  {{- end }}
  TURNBACKS_IDENTITY: {{ .Values.identity.mode | quote }}
  {{- if eq .Values.identity.mode "header" }}
  TURNBACKS_IDENTITY_USER_HEADER: {{ .Values.identity.userHeader | quote }}
  TURNBACKS_IDENTITY_GROUPS_HEADER: {{ .Values.identity.groupsHeader | quote }}
  TURNBACKS_ADMIN_USERS: {{ join "," .Values.identity.adminUsers | quote }}
  TURNBACKS_ADMIN_GROUPS: {{ join "," .Values.identity.adminGroups | quote }}
  {{- end }}
  TURNBACKS_MIGRATE_ON_START: {{ .Values.config.migrateOnStart | quote }}
  TURNBACKS_DB_MAX_CONNS: {{ .Values.config.dbMaxConns | quote }}
  TURNBACKS_DB_WAIT: {{ .Values.config.dbWait | quote }}
  TURNBACKS_TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  PGSSLMODE: {{ .Values.database.sslMode | quote }}
