{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "turnbacks.fullname" . }}
  labels:
    {{- include "turnbacks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "turnbacks.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.restrictEgress }}, Egress{{ end }}]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        # `helm test` readiness pod of this release
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
      ports:
        - port: http
          protocol: TCP
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if .Values.database.cloudnativepg.enabled }}
    # PostgreSQL (CloudNativePG instances)
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "turnbacks.dbClusterName" . }}
      ports:
        - { port: 5432, protocol: TCP }
    {{- else }}
    - ports:
        - { port: 5432, protocol: TCP }
    {{- end }}
    {{- with .Values.networkPolicy.webhookEgress }}
    # Outbound webhooks
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
