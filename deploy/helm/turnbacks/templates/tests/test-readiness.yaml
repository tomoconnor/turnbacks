apiVersion: v1
kind: Pod
metadata:
  name: {{ include "turnbacks.fullname" . }}-test-readiness
  # Deliberately NOT the app's selector labels, so the app's NetworkPolicy
  # does not restrict this pod.
  labels:
    app.kubernetes.io/name: {{ include "turnbacks.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readiness
      image: {{ include "turnbacks.image" . | quote }}
      args: ["healthcheck", "--wait", "60s"]
      env:
        # The healthcheck probes http://<addr>/readyz through the Service.
        - name: TURNBACKS_HTTP_ADDR
          value: "{{ include "turnbacks.fullname" . }}:{{ .Values.service.port }}"
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
