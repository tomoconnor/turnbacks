# Production values (used by deploy/argocd/applicationset.yaml).
image:
  repository: ghcr.io/YOUR-ORG/turnbacks
  tag: "1.0.0" # immutable release tag (or set image.digest)

replicaCount: 2
publicURL: https://turnbacks.example.com


config:
  # Ingress controller pod network; reports are attributed to the client
  # (VPN) address passed through by the ingress.
  trustedProxies: "10.42.0.0/16"

admin:
  clientCA:
    existingSecret: turnbacks-admin-ca # ca.crt only; see docs/admin-certificates.md

database:
  cloudnativepg:
    instances: 3
    storage:
      size: 20Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }
    # Continuous backup with the Barman Cloud plugin (install the plugin and
    # create the ObjectStore "turnbacks-backups" first; see docs/kubernetes.md).
    plugins:
      - name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: turnbacks-backups
    scheduledBackup:
      enabled: true
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

networkPolicy:
  enabled: true
  restrictEgress: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
