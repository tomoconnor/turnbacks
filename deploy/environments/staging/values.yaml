# Staging values (used by deploy/argocd/applicationset.yaml).
image:
  repository: ghcr.io/YOUR-ORG/turnbacks
  tag: main # staging tracks the latest build; prefer a commit SHA for reproducibility

replicaCount: 1
publicURL: https://turnbacks.staging.example.com


config:
  # Ingress controller pod network; reports are attributed to the client
  # (VPN) address passed through by the ingress.
  trustedProxies: "10.42.0.0/16"

admin:
  clientCA:
    existingSecret: turnbacks-admin-ca # ca.crt only; see docs/admin-certificates.md

database:
  cloudnativepg:
    instances: 1
    storage:
      size: 5Gi

podDisruptionBudget:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
