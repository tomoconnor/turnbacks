# Argo CD project scoping what the Turnbacks applications may deploy.
# Replace YOUR-ORG with the organisation that hosts this repository.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: turnbacks
  namespace: argocd
spec:
  description: Turnbacks and its CloudNativePG operator
  sourceRepos:
    - https://github.com/YOUR-ORG/turnbacks.git
    - https://cloudnative-pg.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: turnbacks-*
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
  # Cluster-scoped resources needed by the CloudNativePG operator chart.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
  orphanedResources:
    warn: true
