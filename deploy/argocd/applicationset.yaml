# One Turnbacks Application per environment. Each uses the chart in this
# repository plus deploy/environments/<env>/values.yaml.
# Replace YOUR-ORG (repoURL below and in project.yaml).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: turnbacks
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: staging
            revision: main
            autoSync: true
          - env: production
            # Pin production to a release tag; promote by changing it.
            revision: main
            autoSync: false
  template:
    metadata:
      name: "turnbacks-{{ .env }}"
      labels:
        app.kubernetes.io/part-of: turnbacks
        environment: "{{ .env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: turnbacks
      sources:
        - repoURL: https://github.com/YOUR-ORG/turnbacks.git
          targetRevision: "{{ .revision }}"
          path: deploy/helm/turnbacks
          helm:
            releaseName: turnbacks
            valueFiles:
              - "$values/deploy/environments/{{ .env }}/values.yaml"
        - repoURL: https://github.com/YOUR-ORG/turnbacks.git
          targetRevision: "{{ .revision }}"
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "turnbacks-{{ .env }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
