# Standalone production stack: Caddy (TLS + admin client certificates),
# Turnbacks and PostgreSQL.
#
#   cp .env.example .env                         # set TURNBACKS_HOST, POSTGRES_PASSWORD
#   make build                                   # or use the image: see docs/admin-certificates.md
#   bin/turnbacks ca init --dir ca               # once
#   bin/turnbacks ca issue --dir ca jane         # one certificate per administrator
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
#
# Only ca/ca.crt is mounted into the containers. Keep ca/ca.key somewhere
# safer than the server if you can (docs/admin-certificates.md).
#
# Caddy reaches Turnbacks over a Unix socket on a shared volume, not over a
# network: whatever connects to that socket is the proxy, so Turnbacks can
# believe its X-Forwarded-For and X-Client-Cert headers without any IP-range
# configuration. The app is attached only to the internal backend network
# (PostgreSQL); the database is never published.
name: turnbacks-prod

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TURNBACKS_HOST: ${TURNBACKS_HOST:?set TURNBACKS_HOST in .env}
      TURNBACKS_TLS: ${TURNBACKS_TLS:-internal}
    ports:
      - "${TURNBACKS_HTTP_PORT:-80}:80"
      - "${TURNBACKS_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TURNBACKS_ADMIN_CA:-./ca/ca.crt}:/etc/caddy/admin-ca.crt:ro
      - caddy-data:/data
      - caddy-config:/config
      - app-socket:/run/turnbacks
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  app:
    build: .
    image: ${TURNBACKS_IMAGE:-turnbacks:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TURNBACKS_ENV: production
      TURNBACKS_DATABASE_URL: postgres://${POSTGRES_USER:-turnbacks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-turnbacks}?sslmode=disable
      TURNBACKS_PUBLIC_URL: ${TURNBACKS_PUBLIC_URL:-https://${TURNBACKS_HOST}}
      TURNBACKS_HTTP_ADDR: unix:/run/turnbacks/turnbacks.sock
      TURNBACKS_ADMIN_CLIENT_CA: /etc/turnbacks/admin-ca.crt
      TURNBACKS_ADMIN_CERT_HEADER: X-Client-Cert
    volumes:
      - ${TURNBACKS_ADMIN_CA:-./ca/ca.crt}:/etc/turnbacks/admin-ca.crt:ro
      - app-socket:/run/turnbacks
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnbacks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-turnbacks}
    volumes:
      - db-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  backend:
    internal: true

volumes:
  db-data:
  caddy-data: # Caddy's own certificates and keys
  caddy-config:
  app-socket: # the Unix socket between Caddy and Turnbacks
